# MAEVA IMMOBILIER — reverse proxy vers le backend Node (127.0.0.1:4001)
# Le HTTPS (port 443 + redirection) est ajouté automatiquement par certbot --nginx.
server {
    listen 80;
    listen [::]:80;
    server_name maeva-immobilier.com www.maeva-immobilier.com;

    # Masque la version exacte d'nginx dans les en-têtes et pages d'erreur
    server_tokens off;

    # Import Excel et restauration de sauvegarde
    client_max_body_size 200m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    # HSTS : les navigateurs n'utilisent plus que HTTPS pour ce domaine (2 ans)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # CSP : SPA compilée — scripts/styles/fetch uniquement depuis notre origine.
    # 'unsafe-inline' sur style-src : attributs style utilisés par React.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # L'IP cliente est imposée par nginx : un X-Forwarded-For forgé par le
        # client ne peut plus contourner l'anti-bruteforce du login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
