# MAEVA IMMOBILIER — reverse proxy vers le backend Node (127.0.0.1:4001)
# Le HTTPS (port 443 + redirection) est ajouté automatiquement par certbot --nginx.
server {
    listen 80;
    listen [::]:80;
    server_name maeva-immobilier.com www.maeva-immobilier.com;

    # Import Excel et restauration de sauvegarde
    client_max_body_size 200m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
